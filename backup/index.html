<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>八字排盘命理分析</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- 头部 -->
        <header class="header">
            <h1 class="logo">八字排盘</h1>
            <p class="subtitle">精准的命理分析工具</p>
        </header>

        <!-- 输入表单 -->
        <section class="input-section">
            <div class="card">
                <h2 class="card-title">请输入出生信息</h2>
                
                <div class="form-group">
                    <label class="form-label">出生日期</label>
                    <input type="date" id="birthDate" class="form-input" value="1990-01-01">
                </div>

                <div class="form-group">
                    <label class="form-label">出生时间</label>
                    <input type="time" id="birthTime" class="form-input" value="12:00">
                </div>

                <div class="form-group">
                    <label class="form-label">出生地点</label>
                    <select id="birthLocation" class="form-select">
                        <option value="120.00">北京 (东经120°)</option>
                        <option value="121.47">上海 (东经121.47°)</option>
                        <option value="113.26">广州 (东经113.26°)</option>
                        <option value="104.06">成都 (东经104.06°)</option>
                        <option value="108.93">西安 (东经108.93°)</option>
                        <option value="114.30">武汉 (东经114.30°)</option>
                        <option value="118.78">南京 (东经118.78°)</option>
                        <option value="106.55">重庆 (东经106.55°)</option>
                        <option value="117.27">天津 (东经117.27°)</option>
                        <option value="125.32">哈尔滨 (东经125.32°)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">性别</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="gender" value="1" checked>
                            <span>男</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="gender" value="0">
                            <span>女</span>
                        </label>
                    </div>
                </div>

                <button id="calculateBtn" class="btn btn-primary">
                    开始排盘
                </button>
            </div>
        </section>

        <!-- 加载状态 -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>正在计算中...</p>
        </div>

        <!-- 结果展示区 -->
        <section id="resultSection" class="result-section hidden">
            <!-- 基本信息 -->
            <div class="card">
                <h2 class="card-title">基本信息</h2>
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">公历</span>
                        <span id="solarDate" class="info-value"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">农历</span>
                        <span id="lunarDate" class="info-value"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">生肖</span>
                        <span id="zodiac" class="info-value"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">节气</span>
                        <span id="solarTerm" class="info-value"></span>
                    </div>
                </div>
            </div>

            <!-- 八字排盘 -->
            <div class="card">
                <h2 class="card-title">八字排盘</h2>
                <div class="bazi-paipan">
                    <table class="paipan-table">
                        <thead>
                            <tr>
                                <th></th>
                                <th>年柱</th>
                                <th>月柱</th>
                                <th>日柱</th>
                                <th>时柱</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="tiangan-row">
                                <td class="row-label">天干</td>
                                <td id="yearStem"></td>
                                <td id="monthStem"></td>
                                <td id="dayStem" class="day-master"></td>
                                <td id="hourStem"></td>
                            </tr>
                            <tr class="dizhi-row">
                                <td class="row-label">地支</td>
                                <td id="yearBranch"></td>
                                <td id="monthBranch"></td>
                                <td id="dayBranch"></td>
                                <td id="hourBranch"></td>
                            </tr>
                            <tr class="canggan-row">
                                <td class="row-label">藏干</td>
                                <td id="yearHidden"></td>
                                <td id="monthHidden"></td>
                                <td id="dayHidden"></td>
                                <td id="hourHidden"></td>
                            </tr>
                            <tr class="shishen-row">
                                <td class="row-label">十神</td>
                                <td id="yearShishen"></td>
                                <td id="monthShishen"></td>
                                <td id="dayShishen">日主</td>
                                <td id="hourShishen"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 日主信息 -->
            <div class="card">
                <h2 class="card-title">日主分析</h2>
                <div class="day-master-info">
                    <div class="day-master-card">
                        <span class="day-master-name" id="dayMasterName"></span>
                        <span class="day-master-element" id="dayMasterElement"></span>
                    </div>
                    <p class="day-master-desc" id="dayMasterDesc"></p>
                </div>
            </div>

            <!-- 五行分析 -->
            <div class="card">
                <h2 class="card-title">五行分析</h2>
                <div class="wuxing-analysis">
                    <div class="wuxing-chart" id="wuxingChart"></div>
                    <div class="wuxing-summary" id="wuxingSummary"></div>
                </div>
            </div>

            <!-- 十神分析 -->
            <div class="card">
                <h2 class="card-title">十神分析</h2>
                <div class="shishen-analysis" id="shishenAnalysis"></div>
            </div>

            <!-- 格局分析 -->
            <div class="card">
                <h2 class="card-title">格局分析</h2>
                <div class="geju-analysis">
                    <div class="geju-item">
                        <span class="geju-label">格局类型</span>
                        <span class="geju-value" id="gejuType"></span>
                    </div>
                    <p class="geju-desc" id="gejuDesc"></p>
                </div>
            </div>

            <!-- 纳音 -->
            <div class="card">
                <h2 class="card-title">纳音五行</h2>
                <div class="nayin-list" id="nayinList"></div>
            </div>

            <!-- 大运 -->
            <div class="card">
                <h2 class="card-title">大运走势</h2>
                <div class="dayun-table-container">
                    <table class="dayun-table" id="dayunTable">
                        <thead>
                            <tr>
                                <th>大运</th>
                                <th>起始年龄</th>
                                <th>天干</th>
                                <th>地支</th>
                                <th>十神</th>
                                <th>纳音</th>
                            </tr>
                        </thead>
                        <tbody id="dayunBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- 流年 -->
            <div class="card">
                <h2 class="card-title">近期流年</h2>
                <div class="liunian-list" id="liunianList"></div>
            </div>
        </section>

        <!-- 页脚 -->
        <footer class="footer">
            <p>本应用仅供娱乐参考，请理性看待命理分析</p>
        </footer>
    </div>

    <!-- 加载lunisolar库 -->
    <script src="https://cdn.jsdelivr.net/npm/lunisolar@2.6.0/dist/lunisolar.min.js"></script>
    <script src="js/location-data.js"></script>
    <script src="js/knowledge-base.js"></script>
    <script src="js/bazi-calculator.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
